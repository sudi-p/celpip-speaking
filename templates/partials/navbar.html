<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Check authentication status and update auth button text
    async function updateAuthButtons() {
      try {
        const resp = await fetch('/api/auth/me', { credentials: 'include' });
        const desktopBtn = document.getElementById('nav-auth-btn');
        const mobileBtn = document.getElementById('nav-auth-btn-mobile');

        if (resp.ok) {
          // User is logged in - show logout button
          const user = await resp.json();
          const btnText = `Logout (${user.display_name || user.email})`;
          if (desktopBtn) desktopBtn.textContent = btnText;
          if (mobileBtn) mobileBtn.textContent = btnText;

          // Handle logout
          [desktopBtn, mobileBtn].forEach(btn => {
            if (btn) {
              btn.onclick = async (e) => {
                e.preventDefault();
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                window.location.href = '/login.html';
              };
            }
          });
        } else {
          // User is not logged in - show sign in button
          if (desktopBtn) desktopBtn.textContent = 'Sign In';
          if (mobileBtn) mobileBtn.textContent = 'Sign In';

          // Handle sign in
          [desktopBtn, mobileBtn].forEach(btn => {
            if (btn) {
              btn.onclick = () => window.location.href = '/login.html';
            }
          });
        }
      } catch (err) {
        // Default to sign in on error
        const desktopBtn = document.getElementById('nav-auth-btn');
        const mobileBtn = document.getElementById('nav-auth-btn-mobile');

        [desktopBtn, mobileBtn].forEach(btn => {
          if (btn) {
            btn.textContent = 'Sign In';
            btn.onclick = () => window.location.href = '/login.html';
          }
        });
      }
    }

    // Mobile navbar toggle
    const burger = document.getElementById('navbar-burger');
    const menu = document.getElementById('navbar-menu');
    const mobileDropdownToggle = document.getElementById('mobile-dropdown-toggle');
    const mobileDropdownMenu = document.getElementById('mobile-dropdown-menu');
    const mobileDropdownChevron = document.getElementById('mobile-dropdown-chevron');

    if (burger && menu) {
      burger.addEventListener('click', () => {
        menu.classList.toggle('hidden');
        burger.querySelectorAll('span').forEach((span, index) => {
          if (index === 0) span.classList.toggle('rotate-45');
          if (index === 1) span.classList.toggle('opacity-0');
          if (index === 2) span.classList.toggle('-rotate-45');
        });
      });
    }

    if (mobileDropdownToggle && mobileDropdownMenu) {
      mobileDropdownToggle.addEventListener('click', () => {
        mobileDropdownMenu.classList.toggle('hidden');
        if (mobileDropdownChevron) {
          mobileDropdownChevron.classList.toggle('rotate-180');
        }
      });
    }

    // Update auth buttons based on login status
    updateAuthButtons();

    // Show/hide auth-only links based on login status
    async function updateAuthLinks() {
      try {
        const resp = await fetch('/api/auth/me', { credentials: 'include' });
        const authOnlyLinks = document.querySelectorAll('.auth-only');
        if (resp.ok) {
          authOnlyLinks.forEach(link => link.style.display = 'block');
        } else {
          authOnlyLinks.forEach(link => link.style.display = 'none');
        }
      } catch {
        const authOnlyLinks = document.querySelectorAll('.auth-only');
        authOnlyLinks.forEach(link => link.style.display = 'none');
      }
    }

    updateAuthLinks();
  });
</script>
