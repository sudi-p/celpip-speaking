{% extends "base.html" %}

{% block title %}Settings — CELPIP Practice{% endblock %}

{% block body %}
<div class="container" style="max-width: 600px; margin-top: 2rem; margin-bottom: 3rem;">
  <h1 style="font-size: 1.5rem; margin-bottom: 2rem;">Settings</h1>

  <!-- Profile Section -->
  <div style="background: #fff; border-radius: 10px; padding: 1.5rem; margin-bottom: 2rem; border: 1px solid #e5e7eb;">
    <h2 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;">Profile</h2>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.95rem;">Email</label>
      <input type="email" id="email-display" disabled style="width: 100%; padding: 0.7rem 0.9rem; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px; font-family: inherit;" />
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.95rem;">Display Name</label>
      <input type="text" id="display-name" placeholder="Your display name" maxlength="100" style="width: 100%; padding: 0.7rem 0.9rem; border: 1.5px solid #e5e7eb; border-radius: 8px; font-family: inherit; outline: none;" />
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer; user-select: none;">
        <input type="checkbox" id="companion-visibility" style="width: 18px; height: 18px; cursor: pointer;" />
        <span style="font-weight: 500; font-size: 0.95rem;">Allow companions to see my attempts</span>
      </label>
    </div>

    <button class="btn btn-primary" id="profile-save-btn" style="width: 100%;">Save Profile</button>
    <div id="profile-message" style="margin-top: 0.75rem; font-size: 0.9rem; text-align: center;"></div>
  </div>

  <!-- Password Section -->
  <div style="background: #fff; border-radius: 10px; padding: 1.5rem; margin-bottom: 2rem; border: 1px solid #e5e7eb;">
    <h2 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;">Change Password</h2>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.95rem;">Current Password</label>
      <input type="password" id="current-password" placeholder="Enter current password" style="width: 100%; padding: 0.7rem 0.9rem; border: 1.5px solid #e5e7eb; border-radius: 8px; font-family: inherit; outline: none;" />
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.95rem;">New Password</label>
      <input type="password" id="new-password" placeholder="Enter new password (min 8 characters)" style="width: 100%; padding: 0.7rem 0.9rem; border: 1.5px solid #e5e7eb; border-radius: 8px; font-family: inherit; outline: none;" />
    </div>

    <button class="btn btn-primary" id="password-save-btn" style="width: 100%;">Change Password</button>
    <div id="password-message" style="margin-top: 0.75rem; font-size: 0.9rem; text-align: center;"></div>
  </div>

  <!-- Companions Section -->
  <div style="background: #fff; border-radius: 10px; padding: 1.5rem; margin-bottom: 2rem; border: 1px solid #e5e7eb;">
    <h2 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;">Companions</h2>

    <!-- Add Companion -->
    <div style="margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #e5e7eb;">
      <label style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.95rem;">Add Companion</label>
      <div style="display: flex; gap: 0.5rem;">
        <input type="email" id="companion-email" placeholder="Enter companion's email" style="flex: 1; padding: 0.7rem 0.9rem; border: 1.5px solid #e5e7eb; border-radius: 8px; font-family: inherit; outline: none;" />
        <button class="btn btn-primary" id="send-request-btn">Send Request</button>
      </div>
      <div id="companion-message" style="margin-top: 0.75rem; font-size: 0.9rem;"></div>
    </div>

    <!-- Received Pending Requests -->
    <div id="received-pending" style="margin-bottom: 1.5rem;">
      <h3 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 0.75rem;">Pending Requests</h3>
      <div id="received-pending-list" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
    </div>

    <!-- Accepted Companions -->
    <div id="accepted-companions" style="margin-bottom: 1.5rem;">
      <h3 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 0.75rem;">My Companions</h3>
      <div id="accepted-list" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
    </div>

    <!-- Sent Pending Requests -->
    <div id="sent-pending">
      <h3 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 0.75rem;">Sent Requests</h3>
      <div id="sent-pending-list" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
    </div>
  </div>
</div>

<script>
  const emailDisplay = document.getElementById('email-display');
  const displayNameInput = document.getElementById('display-name');
  const companionVisibilityCheckbox = document.getElementById('companion-visibility');
  const profileSaveBtn = document.getElementById('profile-save-btn');
  const profileMessage = document.getElementById('profile-message');
  const currentPasswordInput = document.getElementById('current-password');
  const newPasswordInput = document.getElementById('new-password');
  const passwordSaveBtn = document.getElementById('password-save-btn');
  const passwordMessage = document.getElementById('password-message');
  const companionEmailInput = document.getElementById('companion-email');
  const sendRequestBtn = document.getElementById('send-request-btn');
  const companionMessage = document.getElementById('companion-message');
  const receivedPendingDiv = document.getElementById('received-pending');
  const receivedPendingList = document.getElementById('received-pending-list');
  const acceptedCompanionsDiv = document.getElementById('accepted-companions');
  const acceptedList = document.getElementById('accepted-list');
  const sentPendingDiv = document.getElementById('sent-pending');
  const sentPendingList = document.getElementById('sent-pending-list');

  function showMessage(el, msg, isError = false) {
    el.textContent = msg;
    el.style.color = isError ? '#991b1b' : '#059669';
  }

  async function loadUserData() {
    try {
      const resp = await fetch('/api/auth/me', { credentials: 'include' });
      if (!resp.ok) {
        window.location.href = '/login.html';
        return;
      }
      const user = await resp.json();
      emailDisplay.value = user.email;
      displayNameInput.value = user.display_name || '';
      companionVisibilityCheckbox.checked = user.companion_visibility;
    } catch (err) {
      showMessage(profileMessage, 'Failed to load profile', true);
    }
  }

  async function loadCompanions() {
    try {
      const resp = await fetch('/api/companions', { credentials: 'include' });
      if (!resp.ok) throw new Error('Failed to load companions');
      const data = await resp.json();

      // Render accepted companions
      if (data.accepted.length === 0) {
        acceptedCompanionsDiv.style.display = 'none';
      } else {
        acceptedList.innerHTML = data.accepted.map(c => `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: #f9fafb; border-radius: 6px;">
            <div>
              <div style="font-weight: 600;">${c.display_name || c.email}</div>
              <div style="font-size: 0.85rem; color: #6b7280;">${c.email}</div>
            </div>
            <button class="btn btn-danger" style="padding: 0.5rem 1rem; font-size: 0.9rem;" onclick="removeCompanion(${c.id})">Remove</button>
          </div>
        `).join('');
      }

      // Render received pending requests
      if (data.received_pending.length === 0) {
        receivedPendingDiv.style.display = 'none';
      } else {
        receivedPendingList.innerHTML = data.received_pending.map(r => `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: #fef3c7; border-radius: 6px;">
            <div>
              <div style="font-weight: 600;">${r.user.display_name || r.user.email}</div>
              <div style="font-size: 0.85rem; color: #6b7280;">${r.user.email}</div>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.9rem;" onclick="acceptCompanion(${r.id})">Accept</button>
              <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;" onclick="rejectCompanion(${r.id})">Reject</button>
            </div>
          </div>
        `).join('');
      }

      // Render sent pending requests
      if (data.sent_pending.length === 0) {
        sentPendingDiv.style.display = 'none';
      } else {
        sentPendingList.innerHTML = data.sent_pending.map(r => `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: #f3f4f6; border-radius: 6px;">
            <div>
              <div style="font-weight: 600;">${r.user.display_name || r.user.email}</div>
              <div style="font-size: 0.85rem; color: #6b7280;">${r.user.email} · Awaiting acceptance</div>
            </div>
            <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;" onclick="removeCompanion(${r.id})">Cancel</button>
          </div>
        `).join('');
      }
    } catch (err) {
      console.error(err);
    }
  }

  async function saveProfile() {
    profileSaveBtn.disabled = true;
    try {
      const resp = await fetch('/api/auth/me', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          display_name: displayNameInput.value.trim(),
          companion_visibility: companionVisibilityCheckbox.checked,
        }),
        credentials: 'include',
      });
      if (!resp.ok) throw new Error('Failed to save profile');
      showMessage(profileMessage, 'Profile saved!');
    } catch (err) {
      showMessage(profileMessage, err.message, true);
    } finally {
      profileSaveBtn.disabled = false;
    }
  }

  async function changePassword() {
    passwordSaveBtn.disabled = true;
    try {
      const currentPw = currentPasswordInput.value.trim();
      const newPw = newPasswordInput.value.trim();

      if (!currentPw || !newPw) {
        showMessage(passwordMessage, 'Both password fields are required', true);
        passwordSaveBtn.disabled = false;
        return;
      }

      const resp = await fetch('/api/auth/me', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          current_password: currentPw,
          password: newPw,
        }),
        credentials: 'include',
      });
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.error || 'Failed to change password');
      }
      showMessage(passwordMessage, 'Password changed!');
      currentPasswordInput.value = '';
      newPasswordInput.value = '';
    } catch (err) {
      showMessage(passwordMessage, err.message, true);
    } finally {
      passwordSaveBtn.disabled = false;
    }
  }

  async function sendCompanionRequest() {
    sendRequestBtn.disabled = true;
    try {
      const email = companionEmailInput.value.trim();
      if (!email) {
        showMessage(companionMessage, 'Email is required', true);
        sendRequestBtn.disabled = false;
        return;
      }
      const resp = await fetch('/api/companions/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
        credentials: 'include',
      });
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.error || 'Failed to send request');
      }
      showMessage(companionMessage, 'Request sent!');
      companionEmailInput.value = '';
      loadCompanions();
    } catch (err) {
      showMessage(companionMessage, err.message, true);
    } finally {
      sendRequestBtn.disabled = false;
    }
  }

  window.acceptCompanion = async function(pk) {
    try {
      const resp = await fetch(`/api/companions/${pk}/accept`, {
        method: 'POST',
        credentials: 'include',
      });
      if (!resp.ok) throw new Error('Failed to accept request');
      loadCompanions();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  window.rejectCompanion = async function(pk) {
    try {
      const resp = await fetch(`/api/companions/${pk}/reject`, {
        method: 'POST',
        credentials: 'include',
      });
      if (!resp.ok) throw new Error('Failed to reject request');
      loadCompanions();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  window.removeCompanion = async function(pk) {
    if (!confirm('Are you sure?')) return;
    try {
      const resp = await fetch(`/api/companions/${pk}`, {
        method: 'DELETE',
        credentials: 'include',
      });
      if (!resp.ok) throw new Error('Failed to remove companion');
      loadCompanions();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  // Event listeners
  profileSaveBtn.addEventListener('click', saveProfile);
  passwordSaveBtn.addEventListener('click', changePassword);
  sendRequestBtn.addEventListener('click', sendCompanionRequest);

  // Load data on page load
  loadUserData();
  loadCompanions();
</script>
{% endblock %}
