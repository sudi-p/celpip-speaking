{% extends "base.html" %}
{% block title %}CELPIP — Record{% endblock %}

{% block body %}
  <div class="container">
    <div class="task-header">
      <div class="task-header-top">
        <h1 id="task-title">Loading…</h1>
      </div>
      <!-- Question sits directly below the task title, same visual block -->
      <div id="question-panel" style="display:none">
        <div class="question-label" id="question-label">Question</div>
        <div class="question-text" id="question-text"></div>
      </div>
    </div>

    <!-- Recording controls — always stay at top, reset between attempts -->
    <div class="record-controls" id="record-controls">
      <div class="phase-label" id="phase-label">Ready</div>
      <div class="timer" id="timer">--:--</div>
      <div style="text-align:center">
        <button class="btn btn-primary" id="main-btn" disabled>Start Preparation</button>
      </div>
      <div id="error-area" class="error-msg" style="text-align:center;margin-top:.75rem"></div>
    </div>

    <!-- Attempts accumulate here, newest at top -->
    <div id="attempts-list"></div>
  </div>
{% endblock %}

{% block scripts %}
<script>
  const params    = new URLSearchParams(location.search);
  const sessionId = params.get("session") || "";

  const SCENARIO_TASKS = new Set([3, 4, 5, 8]);

  // question and task are set once the session loads
  let question = sessionStorage.getItem("celpip_question") || "";
  sessionStorage.removeItem("celpip_question");
  let taskId = null;
  let task   = null;
  let attemptCount = 0;

  function showQuestion(text, label) {
    document.getElementById("question-text").textContent = text;
    document.getElementById("question-label").textContent = label || "Question";
    document.getElementById("question-panel").style.display = "block";
  }

  // ── Load session: derives task, question, and pre-renders attempts ────────
  async function loadSession() {
    if (!sessionId) {
      document.getElementById("task-title").textContent = "No session specified";
      return;
    }

    let session;
    try {
      session = await apiGet(`/sessions/${sessionId}`);
    } catch (e) {
      document.getElementById("task-title").textContent = "Failed to load session";
      return;
    }

    // Derive task from session
    taskId = session.task_id;
    task   = TASKS[taskId];
    if (!task) {
      document.getElementById("task-title").textContent = "Unknown task";
      return;
    }
    document.getElementById("task-title").textContent = `Task ${taskId}: ${task.name}`;
    document.getElementById("timer").textContent = fmtTime(task.prep);

    // Apply question — sessionStorage first, then session, then oldest attempt
    if (!question) {
      const sessionQ = session.question
        || (session.attempts && session.attempts.length > 0
            ? [...session.attempts].sort((a, b) => new Date(a.created_at) - new Date(b.created_at))[0].question
            : "");
      if (sessionQ) question = sessionQ;
    }
    if (question) showQuestion(question, SCENARIO_TASKS.has(taskId) ? "Inferred Topic" : "Question");

    // Pre-render existing attempts oldest→newest so newest ends up on top
    if (session.attempts && session.attempts.length > 0) {
      const sorted = [...session.attempts].sort(
        (a, b) => new Date(a.created_at) - new Date(b.created_at)
      );
      attemptCount = sorted.length;
      sorted.forEach((a, i) => {
        const card = document.createElement("div");
        card.className = "attempt-card";
        const result = {
          id: a.id,
          score: a.score,
          transcript: a.transcript,
          audio_url: a.audio_url,
          ...(a.evaluation_json || {}),
        };
        const prevScore = i > 0 ? sorted[i - 1].score : null;
        fillAttemptCard(card, i + 1, result, a.audio_url, a.duration_sec, a.created_at, prevScore);
        document.getElementById("attempts-list").prepend(card);
      });
    }

    document.getElementById("main-btn").disabled = false;
    document.getElementById("phase-label").textContent =
      attemptCount > 0 ? "Ready for next attempt" : "Ready";
  }

  loadSession();

  // ── Recording state machine ───────────────────────────────────────────────
  const phaseLabel = document.getElementById("phase-label");
  const timerEl    = document.getElementById("timer");
  const mainBtn    = document.getElementById("main-btn");
  const errorArea  = document.getElementById("error-area");

  let phase = "idle";
  let mediaRecorder = null;
  let audioChunks   = [];
  let recordingStart = null;
  let activeCountdown = null;

  function setError(msg) { errorArea.textContent = msg; }
  function clearError()  { errorArea.textContent = ""; }

  mainBtn.addEventListener("click", () => {
    if (phase === "idle")           startPrep();
    else if (phase === "recording") stopRecordingEarly();
  });

  function startPrep() {
    phase = "prep";
    phaseLabel.textContent = "Preparation";
    mainBtn.disabled = true;
    clearError();
    activeCountdown = countdown(
      task.prep,
      (s) => { timerEl.textContent = fmtTime(s); },
      () => startRecording()
    );
  }

  async function startRecording() {
    phase = "recording";
    phaseLabel.textContent = "Recording";
    mainBtn.textContent = "Stop Early";
    mainBtn.disabled = false;

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      setError("Microphone access denied. Please allow microphone and reload.");
      resetToIdle();
      return;
    }

    audioChunks   = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = finishRecording;
    mediaRecorder.start();
    recordingStart = Date.now();

    activeCountdown = countdown(
      task.speak,
      (s) => { timerEl.textContent = fmtTime(s); },
      () => { if (phase === "recording") stopRecording(); }
    );
  }

  function stopRecordingEarly() {
    if (activeCountdown) { clearInterval(activeCountdown); activeCountdown = null; }
    stopRecording();
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach((t) => t.stop());
    }
  }

  async function finishRecording() {
    const durationSec = Math.round((Date.now() - recordingStart) / 1000);
    const mimeType    = audioChunks[0]?.type || "audio/webm";
    const blob        = new Blob(audioChunks, { type: mimeType });
    const blobUrl     = URL.createObjectURL(blob);

    phase = "processing";
    phaseLabel.textContent = "Analysing…";
    mainBtn.disabled = true;
    mainBtn.textContent = "Analysing…";
    timerEl.textContent = "--:--";
    clearError();

    attemptCount += 1;
    const placeholder = createPlaceholderCard(attemptCount, blobUrl);
    document.getElementById("attempts-list").prepend(placeholder);
    placeholder.scrollIntoView({ behavior: "smooth", block: "start" });

    const formData = new FormData();
    formData.append("audio", blob, `recording.${mimeType.includes("mp4") ? "mp4" : "webm"}`);
    formData.append("task_id", taskId);
    formData.append("duration_sec", durationSec);
    formData.append("question", question);
    formData.append("session_id", sessionId);
    formData.append("user_name", getUserName());

    let result;
    try {
      result = await apiPost("/submit", formData);
    } catch (e) {
      placeholder.querySelector(".attempt-status").textContent = `Error: ${e.message}`;
      placeholder.querySelector(".attempt-status").style.color = "#dc2626";
      resetToIdle();
      return;
    }

    fillAttemptCard(placeholder, attemptCount, result, blobUrl, durationSec, null, result.prev_score ?? null);

    // Tasks 3/4/5/8: show inferred topic after first recording
    if (result.session_question) {
      question = result.session_question;
      showQuestion(result.session_question, "Inferred Topic");
    }

    resetToIdle();
  }

  function resetToIdle() {
    phase = "idle";
    phaseLabel.textContent = attemptCount > 0 ? "Ready for next attempt" : "Ready";
    mainBtn.textContent = "Start Preparation";
    mainBtn.disabled = false;
    timerEl.textContent = fmtTime(task.prep);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ── Card builders ─────────────────────────────────────────────────────────

  function createPlaceholderCard(n, blobUrl) {
    const card = document.createElement("div");
    card.className = "attempt-card";
    card.innerHTML = `
      <div class="attempt-card-header">
        <span class="attempt-num">Attempt #${n}</span>
        <audio class="attempt-audio" controls src="${blobUrl}"></audio>
      </div>
      <p class="attempt-status">Transcribing and evaluating… please wait.</p>
    `;
    return card;
  }

  function renderComparison(containerEl, cmp) {
    const listHtml = (arr, cls) =>
      Array.isArray(arr) && arr.length
        ? `<ul class="comparison-list ${cls}">${arr.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`
        : `<p class="comparison-empty">None noted</p>`;
    containerEl.innerHTML = `
      <div class="comparison-col">
        <div class="comparison-heading improved">&#8593; What improved</div>
        ${listHtml(cmp.improvements, "improved")}
      </div>
      <div class="comparison-col">
        <div class="comparison-heading regressed">&#8595; What got worse</div>
        ${listHtml(cmp.regressions, "regressed")}
      </div>
    `;
  }

  function scoreDeltaHtml(current, prev) {
    if (prev == null || current == null || current === "?" || prev === "?") return "";
    const diff = current - prev;
    if (diff > 0) return `<span class="score-delta up">&#8593; +${diff}</span>`;
    if (diff < 0) return `<span class="score-delta down">&#8595; ${diff}</span>`;
    return "";
  }

  function fillAttemptCard(card, n, result, audioSrc, durationSec, createdAt, prevScore) {
    const score      = result.score ?? "?";
    const scoreClass = score >= 10 ? "good" : score >= 7 ? "mid" : "low";
    const src        = result.audio_url || audioSrc || "";
    const durLabel   = durationSec != null ? `${durationSec}s` : "";
    const dateLabel  = createdAt
      ? `<span class="meta" style="margin-left:.5rem">${new Date(createdAt).toLocaleString()}</span>`
      : "";
    const nameLabel  = result.user_name
      ? `<span class="attempt-user-name">by ${escapeHtml(result.user_name)}</span>`
      : "";
    const deltaHtml  = scoreDeltaHtml(score, prevScore);

    card.innerHTML = `
      <div class="attempt-card-header">
        <span class="attempt-num">Attempt #${n}</span>
        <div class="attempt-card-meta">
          <span class="score-badge ${scoreClass} js-score-badge">${escapeHtml(String(score))}<span>/12</span></span>
          ${result.id ? `<button class="btn btn-secondary js-reeval" data-id="${result.id}" style="font-size:.78rem;padding:.3rem .8rem">Re-evaluate</button>
          <span class="js-reeval-msg" style="font-size:.78rem;color:#888"></span>` : ""}
          ${durLabel ? `<span class="meta">${durLabel}</span>` : ""}
          ${nameLabel}
          ${dateLabel}
        </div>
      </div>
      ${deltaHtml ? `<div class="attempt-progress js-delta">${deltaHtml} from previous attempt</div>` : ""}
      <audio class="attempt-audio" controls src="${escapeHtml(src)}"></audio>
      <details class="attempt-details" open>
        <summary>Transcript</summary>
        <p class="attempt-transcript">${escapeHtml(result.transcript || "")}</p>
      </details>
      ${(n > 1 && result.comparison) ? `
      <details class="attempt-details attempt-comparison" open>
        <summary>Progress vs Previous Attempt</summary>
        <div class="comparison-body"></div>
      </details>` : ""}
      <details class="attempt-details" open>
        <summary>Evaluation</summary>
        <div class="attempt-eval"></div>
      </details>
    `;

    if (n > 1 && result.comparison) renderComparison(card.querySelector(".comparison-body"), result.comparison);
    renderEvaluation(card.querySelector(".attempt-eval"), result);
    wireReevaluate(card);
  }

  function wireReevaluate(card) {
    const btn = card.querySelector(".js-reeval");
    if (!btn) return;

    btn.addEventListener("click", async () => {
      const id  = btn.dataset.id;
      const msg = card.querySelector(".js-reeval-msg");
      btn.disabled = true;
      btn.textContent = "Re-evaluating…";
      msg.textContent = "";

      let result;
      try {
        result = await apiPost(`/attempts/${id}/reevaluate`, {});
      } catch (e) {
        msg.textContent = `Error: ${e.message}`;
        msg.style.color = "#dc2626";
        btn.disabled = false;
        btn.textContent = "Re-evaluate";
        return;
      }

      // Update score badge
      const badge = card.querySelector(".js-score-badge");
      const oldScore = result.old_score ?? null;
      const newScore = result.score ?? "?";
      const newClass = newScore >= 10 ? "good" : newScore >= 7 ? "mid" : "low";
      badge.className = `score-badge ${newClass} js-score-badge`;
      badge.innerHTML = `${escapeHtml(String(newScore))}<span>/12</span>`;

      // Update progress row below the header
      const deltaRow = card.querySelector(".js-delta");
      const newDelta = scoreDeltaHtml(newScore, oldScore);
      if (deltaRow) {
        if (newDelta) deltaRow.innerHTML = `${newDelta} from previous score`;
        else deltaRow.remove();
      } else if (newDelta) {
        const row = document.createElement("div");
        row.className = "attempt-progress js-delta";
        row.innerHTML = `${newDelta} from previous score`;
        card.querySelector(".attempt-card-header").insertAdjacentElement("afterend", row);
      }

      // Re-render comparison and evaluation sections
      if (result.comparison) {
        let cmpBody = card.querySelector(".comparison-body");
        if (!cmpBody) {
          const det = document.createElement("details");
          det.className = "attempt-details attempt-comparison";
          det.open = true;
          det.innerHTML = `<summary>Progress vs Previous Attempt</summary><div class="comparison-body"></div>`;
          card.querySelector(".attempt-eval").closest("details").insertAdjacentElement("beforebegin", det);
          cmpBody = det.querySelector(".comparison-body");
        }
        renderComparison(cmpBody, result.comparison);
      }
      renderEvaluation(card.querySelector(".attempt-eval"), result);

      msg.style.color = "#059669";
      msg.textContent = "Updated.";
      btn.disabled = false;
      btn.textContent = "Re-evaluate";
    });
  }
</script>
{% endblock %}
