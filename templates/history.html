{% extends "base.html" %}
{% block title %}CELPIP — History{% endblock %}

{% block body %}
  <div class="container">
    <header>
      <h1>Practice History</h1>
    </header>
    <div id="error-area" class="error-msg"></div>
    <div id="content"></div>
  </div>
{% endblock %}

{% block scripts %}
<script>
  async function load() {
    let sessions;
    try {
      sessions = await apiGet("/sessions");
    } catch (e) {
      document.getElementById("error-area").textContent = `Failed to load history: ${e.message}`;
      return;
    }

    const content = document.getElementById("content");

    if (sessions.length === 0) {
      content.innerHTML = `<p class="empty-msg">No sessions yet — go practice!</p>`;
      return;
    }

    const rows = sessions.map((s) => {
      const scoreClass = s.avg_score >= 10 ? "good" : s.avg_score >= 7 ? "mid" : "low";
      const scoreBadge = s.avg_score != null
        ? `<span class="score-pill ${scoreClass}">${s.avg_score}/12</span>`
        : `<span class="score-pill low">—</span>`;
      const date    = new Date(s.created_at).toLocaleDateString();
      const snippet = s.question
        ? `<div class="session-question-snippet">${escapeHtml(s.question.length > 75 ? s.question.slice(0, 75) + "…" : s.question)}</div>`
        : "";
      const isWriting = WRITING_TASK_IDS.has(s.task_id);
      const viewHref  = `${isWriting ? "write" : "record"}.html?session=${s.id}`;

      return `
        <tr class="session-row" data-href="${viewHref}">
          <td>
            <div class="session-name">
            ${isWriting
              ? `<span class="practice-section-label writing-label" style="font-size:.65rem;padding:.1rem .5rem;margin-right:.4rem">Writing</span>`
              : ""}
            ${escapeHtml(s.task_name)}
          </div>
            <div style="font-size:.78rem;color:#888;margin-top:.1rem">${escapeHtml(s.name)}</div>
            ${snippet}
          </td>
          <td>${escapeHtml(date)}</td>
          <td>${escapeHtml(String(s.attempt_count))}</td>
          <td>${scoreBadge}</td>
          <td><a href="${viewHref}" class="btn btn-secondary" style="padding:.3rem .75rem;font-size:.8rem">Open</a></td>
        </tr>
      `;
    }).join("");

    content.innerHTML = `
      <table class="sessions-table">
        <thead>
          <tr>
            <th>Session</th>
            <th>Started</th>
            <th>Attempts</th>
            <th>Avg Score</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    content.querySelectorAll(".session-row").forEach((row) => {
      row.addEventListener("click", (e) => {
        if (e.target.tagName === "A") return;
        window.location.href = row.dataset.href;
      });
    });
  }

  load();
</script>
{% endblock %}
